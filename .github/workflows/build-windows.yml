name: 手动构建 Windows 客户端

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: "构建产物名称"
        required: false
        default: "weee-flow-windows"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows client
        env:
          CLIENT_RUN_PASSWORD: ${{ secrets.CLIENT_RUN_PASSWORD }}
          CLIENT_SKIP_PAYLOAD: "true"
        run: npm run build:client:win

      - name: Upload client zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/weee-flow-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: client-win-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "dist/weee-flow-win-x64.zip" `
            --repo "$env:REPOSITORY" `
            --target "${{ github.sha }}" `
            --title "Windows 客户端 $env:RELEASE_TAG" `
            --notes "手动构建的 Windows 客户端壳包。请把本地生成的 workflow.js.enc 放到解压后的客户端根目录。"
          $downloadUrl = "https://github.com/$env:REPOSITORY/releases/latest/download/weee-flow-win-x64.zip"
          "## 客户下载地址" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $downloadUrl | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
